name: Poster PDF

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  poster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: make poster
      - uses: actions/upload-artifact@v4
        with:
          name: poster
          path: |
            dist/gewaesserstammbaum-a0.pdf
            build/poster-preview.png
